name: "Terraform CI/CD Pipeline"
# 1. 트리거 조건 설정: 어떤 이벤트에서 워크플로우를 실행할지 지정
on:
  push:
    branches: [main]
    paths: # 배포 기준이 될 파일이 있는 위치(변경된 파일 기준)
      - 'infra/project/**'
#         - 'project/**'
  pull_request:
    branches: [main]
    paths: # 배포 기준이 될 파일이 있는 위치(변경된 파일 기준)
      - 'infra/project/**'
#         - 'project/**'
# 2. 권한 설정 (OpenID Connect 또는 시크릿 접근 권한)
permissions:
  contents: read

jobs:
  terraform:
    # 3. 전체 작업에 대한 서버 구성 및 배포 설정 파일의 위치
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra/project

    steps:
      # 3-1. 소스 코드 체크아웃 (체크아웃?: 저장소의 파일을 러너로 다운로드)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 3-2. Terraform CLI 도구 설치
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.x

      # 3-3. AWS 인증 정보 설정 (GitHub Secrets 활용)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY  }}
          aws-region: ${{ secrets.AWS_REGION }}
          audience: sts.amazonaws.com   # AWS 접속을 위한 토큰 발급 대상 지정
          output-env-credentials: true  # 깃허브 액션의 환경 변수로 자동 저장

      # 3-4. 테라폼 초기화 (Provider 다운로드 및 Backend 설정)
      - name: Terraform Init
        run: terraform init

      # 3-5. 테라폼 코드 포맷 검증
      - name: Terraform Validate
        run: terraform validate

      # 3-6. 변경 사항 미리보기 (Plan)
      # 컬러를 포함할 경우 색상코드를 텍스트로 표현해 깨져서 출력되는 것을 방지
      - name: Terraform Plan
        run: terraform plan -no-color
        continue-on-error: false  # 에러 발생시 다음 단계 진행 여부 결정(true-진행, false-종료)

      # 3-7. 인프라 반영 (Apply) or - main 브랜치에 푸시(Merge)될 때만 실행
      - name: Terraform Apply or Destory
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve
